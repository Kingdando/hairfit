services:
  - type: web
    name: facefit-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FACE_ANALYSIS_URL
        sync: false

  - type: web
    name: facefit-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_FACE_ANALYSIS_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
