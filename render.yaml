services:
  - type: web
    name: facefit-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_SSL
        value: true
      - key: DB_POOL_SIZE
        value: 10
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ANALYSIS_MODEL
        value: gemini-3.8-flash

  - type: web
    name: facefit-face-analysis
    runtime: docker
    dockerfilePath: ./php-api/Dockerfile
    dockerContext: ./php-api
    healthCheckPath: /health.php
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ANALYSIS_MODEL
        value: gemini-3.8-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        fromService:
          type: web
          name: facefit-api
          envVarKey: JWT_SECRET
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: facefit-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_FACE_ANALYSIS_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
